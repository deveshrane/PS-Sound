<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Sound: Vibrations and Resonance</title>
  </head>

  <body>
    <div class="app">
      <aside class="panel" id="panel">
        <h1>Vibrations and Resonance</h1>
        <p class="sub">Sound, ICSE Class X, Chapter 7 (B)</p>

        <p class="group-label">Vibrations</p>
        <div class="modes grid topics" role="group" aria-label="Vibration topics">
          <button type="button" data-topic="natural" aria-pressed="true">Natural frequency</button>
          <button type="button" data-topic="damped" aria-pressed="false">Damped</button>
          <button type="button" data-topic="sonometer" aria-pressed="false">String &amp; sonometer</button>
          <button type="button" data-topic="pipes" aria-pressed="false">Organ pipes</button>
        </div>
        <p class="group-label">Resonance</p>
        <div class="modes grid topics" role="group" aria-label="Resonance topics">
          <button type="button" data-topic="forced" aria-pressed="false">Forced &amp; resonance</button>
          <button type="button" data-topic="barton" aria-pressed="false">Barton's &amp; forks</button>
          <button type="button" data-topic="tube" aria-pressed="false">Resonance tube</button>
          <button type="button" data-topic="everyday" aria-pressed="false">Around us</button>
        </div>

        <div class="topic-head">
          <h2 id="tTitle"></h2>
          <p class="sub" id="tSub"></p>
        </div>

        <div id="controls"></div>

        <div class="actions shared">
          <button type="button" id="pause" aria-pressed="false">Pause</button>
          <button type="button" id="sound" aria-pressed="false">Sound: off</button>
        </div>

        <p class="section-label">Working</p>
        <div class="work" id="work"></div>

        <p class="hint" id="hint"></p>
      </aside>

      <main class="stage">
        <section class="card">
          <canvas id="canvas"></canvas>
        </section>
      </main>
    </div>

    <script src="core.js"></script>
    <script src="sims/natural.js"></script>
    <script src="sims/damped.js"></script>
    <script src="sims/sonometer.js"></script>
    <script src="sims/pipes.js"></script>
    <script src="sims/forced.js"></script>
    <script src="sims/barton.js"></script>
    <script src="sims/tube.js"></script>
    <script src="sims/everyday.js"></script>
    <script>App.start();</script>
  </body>
</html>
